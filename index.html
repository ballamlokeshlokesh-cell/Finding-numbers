<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequential Number Finder Game</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --success-color: #10b981;
            --error-color: #ef4444;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-wrapper {
            background: var(--container-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        /* Screen Configurations */
        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Setup Panel Utilities */
        .setup-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .setup-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .radio-options, .timer-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn-option {
            background: white;
            border: 2px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-option:hover {
            border-color: var(--primary-color);
        }

        .btn-option.selected {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .custom-time-input {
            margin-top: 10px;
            display: none;
        }

        .custom-time-input input {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
        }

        .btn-main {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        .btn-main:hover {
            background-color: var(--primary-hover);
        }

        /* HUD Info Bar */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            font-weight: 600;
        }

        .hud-item span {
            color: var(--primary-color);
            font-size: 18px;
        }

        /* Number Grid Layout */
        .grid-container {
            display: grid;
            gap: 10px;
            margin: 20px auto;
            max-width: 450px;
            aspect-ratio: 1 / 1;
        }

        .grid-cell {
            background-color: #f3f4f6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: transparent; /* Initially Hidden */
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .grid-cell:hover:not(.found) {
            background-color: #e5e7eb;
        }

        /* Game Interaction Statuses */
        .grid-cell.found {
            background-color: var(--success-color);
            color: white !important;
            cursor: default;
        }

        .grid-cell.wrong-blink {
            background-color: var(--error-color) !important;
            color: white !important;
            animation: shake 0.2s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* End Game Screen elements */
        .status-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>Sequence Finder</h1>
        <div class="subtitle">Find the unique hidden numbers in strict ascending order</div>

        <!-- SCREEN 1: MENU CONFIGURATION -->
        <div id="menu-screen" class="screen active">
            <div class="setup-group">
                <label>Select Difficulty</label>
                <div class="radio-options">
                    <div class="btn-option selected" data-type="diff" data-val="easy">Easy</div>
                    <div class="btn-option" data-type="diff" data-val="medium">Medium</div>
                    <div class="btn-option" data-type="diff" data-val="hard">Hard</div>
                </div>
            </div>

            <div class="setup-group">
                <label>Timer Settings</label>
                <div class="timer-options">
                    <div class="btn-option selected" data-type="timer" data-val="standard">Standard</div>
                    <div class="btn-option" data-type="timer" data-val="none">No Timer</div>
                    <div class="btn-option" data-type="timer" data-val="custom">Custom</div>
                </div>
                <div class="custom-time-input" id="custom-timer-wrapper">
                    <input type="number" id="custom-seconds" placeholder="Enter time limit in seconds (e.g. 45)" min="5">
                </div>
            </div>

            <button class="btn-main" id="btn-start">Start Level 1</button>
        </div>

        <!-- SCREEN 2: ACTIVE GAMEPLAY -->
        <div id="game-screen" class="screen">
            <div class="hud-bar">
                <div class="hud-item">Level: <span id="hud-level">1</span>/100</div>
                <div class="hud-item">Next Number: <span id="hud-target">1</span></div>
                <div class="hud-item">Time Remaining: <span id="hud-time">--</span></div>
            </div>

            <div class="grid-container" id="number-grid"></div>
            <button class="btn-main" style="background-color: var(--text-muted);" id="btn-quit">Quit Game</button>
        </div>

        <!-- SCREEN 3: GAME OVER / WIN -->
        <div id="end-screen" class="screen">
            <div class="status-icon" id="end-icon">🎉</div>
            <h2 id="end-title">Level Complete!</h2>
            <p id="end-message" style="margin: 15px 0; color: var(--text-muted);"></p>
            <button class="btn-main" id="btn-action">Next Level</button>
        </div>
    </div>

    <script>
        // Core Game Configurations & States
        const state = {
            currentLevel: 1,
            maxLevels: 100,
            difficulty: 'easy',
            timerMode: 'standard',
            customTimeLimit: 30,
            targetNumber: 1,
            totalNumbers: 12,
            timeRemaining: 0,
            timerInterval: null,
            numbersList: []
        };

        // DOM Element Cache
        const menuScreen = document.getElementById('menu-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        const gridContainer = document.getElementById('number-grid');
        const customTimerWrapper = document.getElementById('custom-timer-wrapper');
        
        // Setup configuration option clicks
        document.querySelectorAll('.btn-option').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const type = btn.getAttribute('data-type');
                // Unselect siblings
                document.querySelectorAll(`.btn-option[data-type="${type}"]`).forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');

                if (type === 'diff') {
                    state.difficulty = btn.getAttribute('data-val');
                } else if (type === 'timer') {
                    state.timerMode = btn.getAttribute('data-val');
                    customTimerWrapper.style.display = state.timerMode === 'custom' ? 'block' : 'none';
                }
            });
        });

        // Initialize Level parameters based on level number and difficulty
        function setupLevelParameters() {
            // Numbers base increases gradually over the 100 levels
            let baseCount = 9 + Math.floor(state.currentLevel * 0.4); 
            
            if (state.difficulty === 'medium') baseCount += 4;
            if (state.difficulty === 'hard') baseCount += 8;

            // Cap the grid configuration sizes reasonably
